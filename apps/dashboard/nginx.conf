server {
	listen 3000;
	server_name _;
	root /usr/share/nginx/html;

	location = /healthz {
		access_log off;
		return 200 "ok";
	}

	# File hasil build Vite punya hash di nama, aman di-cache lama.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# SPA: route dashboard (/cms, /blog, ...) jatuh ke index.html.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri /index.html;
	}
}
